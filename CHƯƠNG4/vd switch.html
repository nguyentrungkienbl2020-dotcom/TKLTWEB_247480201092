<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("In ra màn hình:");
        var nam=prompt("Nhập Năm:");
        document.write("<br>")
        document.write(nam);
        switch (nam)
        {
            case "1": document.write("Học đại đương"); break;
            case "2": document.write("Học cơ sở chuyên ngành"); break;
            case "3": document.write("Học chuyên ngành"); break;
            case "4": document.write("Làm khoá luân"); break;
            default : document.write("Ra trường");
        }
    </script>
</body>
</html>
