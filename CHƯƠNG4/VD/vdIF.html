<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var diem = prompt("Nhập điểm:");
        var xeploai;
        document.write("In ra màn hình:"+diem);
        if(diem >=8.5){
            xeploai="gioi";
            document.write("<br>");
            document.write(xeploai);
        }
        else if(diem >=7){
            xeploai="khá";
            document.write("<br>");
            document.write(xeploai);
        }
        else if (diem >=5) {
            xeploai="trungbinh";
            document.write("<br>");
            document.write(xeploai);
        }
        else  {
            xeploai="yếu";
            document.write("<br>");
            document.write(xeploai);
        }
       

    </script>
</body>
</html>
